<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Disciple AI</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="colors_and_type.css">
<style>
:root{
  --bk:#0A0908;
  --bk-2:#161311;
  --bk-3:#1F1A17;
  --line:rgba(244,236,221,.10);
  --line-2:rgba(244,236,221,.18);
  --paper:#F4ECDD;
  --paper-dim:#D9CFC0;
  --paper-mute:#8A7E72;
  --ox:#A5331F;
  --gilt:#C9A24B;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bk);color:var(--paper);font-family:var(--font-serif);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
body::before{content:'';position:absolute;inset:0;background-image:url('assets/pattern-glass.svg');background-size:420px;opacity:.07;pointer-events:none;mix-blend-mode:screen;}
body::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 30%, rgba(165,51,31,.18), transparent 70%);pointer-events:none;}

.frame{position:relative;width:100%;max-width:420px;padding:48px 32px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;justify-content:center;margin-bottom:48px;}
.brand img{height:32px;}
.brand .mk{font-family:var(--font-serif);font-size:24px;color:var(--paper);font-weight:500;letter-spacing:-.01em;}
.brand .ai{font-family:var(--font-mono);font-size:13px;color:var(--ox);letter-spacing:.22em;margin-left:2px;}

.card{background:var(--bk-2);border:1px solid var(--line-2);border-radius:3px;padding:44px 40px;position:relative;}
.card::before{content:'';position:absolute;left:-1px;top:36px;bottom:36px;width:2px;background:var(--ox);}

.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gilt);margin-bottom:14px;}
h1{font-family:var(--font-serif);font-weight:500;font-size:36px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;color:var(--paper);}
h1 em{font-style:italic;color:var(--ox);font-weight:400;}
.lede{font-family:var(--font-serif);font-size:15.5px;line-height:1.5;color:var(--paper-dim);margin:0 0 32px;}

form{display:flex;flex-direction:column;gap:14px;}
label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-mute);}
input[type=password], input[type=text]{font-family:var(--font-sans);font-size:15px;background:var(--bk);color:var(--paper);border:1px solid var(--line-2);border-radius:2px;padding:14px 16px;outline:0;width:100%;transition:border-color .15s var(--ease-out);}
input[type=password]:focus, input[type=text]:focus{border-color:var(--gilt);}
input::placeholder{color:var(--paper-mute);}

button{font-family:var(--font-sans);font-weight:600;font-size:14.5px;background:var(--paper);color:var(--bk);padding:14px 22px;border-radius:2px;border:0;cursor:pointer;letter-spacing:.02em;margin-top:8px;transition:background .15s var(--ease-out), color .15s var(--ease-out);}
button:hover{background:var(--ox);color:var(--paper);}
button:disabled{opacity:.5;cursor:default;}

.err{font-family:var(--font-mono);font-size:12px;color:var(--ox);letter-spacing:.04em;margin-top:6px;min-height:1em;}

.scripture{font-family:var(--font-serif);font-style:italic;font-size:13.5px;color:var(--paper-mute);text-align:center;margin:32px auto 0;max-width:340px;line-height:1.5;}
.scripture .ref{font-family:var(--font-mono);font-size:11px;color:var(--gilt);letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:8px;font-style:normal;}
</style>
</head>
<body>
<main class="frame">
  <a class="brand" href="/">
    <img src="assets/logo-mark.svg" alt="">
    <span class="mk">Disciple<span class="ai">AI</span></span>
  </a>

  <div class="card">
    <div class="eyebrow">Marketing log · private</div>
    <h1>Sign <em>in.</em></h1>
    <p class="lede">A working dashboard for the quiz-to-interview nurture sequence.</p>

    <form id="login">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" required autocomplete="current-password" autofocus>
      <div class="err" id="err"></div>
      <button type="submit" id="submit">Enter →</button>
    </form>
  </div>

  <p class="scripture">"Whoever can be trusted with very little can also be trusted with much."<span class="ref">Luke 16:10</span></p>
</main>
<script>
const form = document.getElementById('login');
const err = document.getElementById('err');
const btn = document.getElementById('submit');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
      credentials: 'same-origin',
    });
    if (r.ok) {
      const next = new URLSearchParams(location.search).get('next') || '/dashboard';
      window.location = next;
    } else {
      err.textContent = r.status === 429 ? 'Too many attempts. Wait a minute.' : 'Wrong password.';
      btn.disabled = false;
      btn.textContent = 'Enter →';
    }
  } catch (e2) {
    err.textContent = 'Network error. Try again.';
    btn.disabled = false;
    btn.textContent = 'Enter →';
  }
});
</script>
</body>
</html>
