<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Church Leadership Quiz — Disciple AI</title>
<meta name="description" content="An 11-question essay in disguise. Where does your church stand on AI?">
<meta property="og:title" content="AI Church Leadership Quiz — Disciple AI">
<meta property="og:description" content="11 questions. 5 archetypes. A letter grade you can use.">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/ai-quiz/quiz.css">
</head>
<body>
<main id="app" data-view="landing">

  <section id="view-landing" class="view view-landing">
    <article class="card">
      <p class="chapter-mark">A free tool · Disciple AI</p>
      <h1>How prepared is <em>your congregation</em> for AI?</h1>
      <p class="lede">Eleven questions. Five archetypes. A letter grade you can actually use — and no detectable right answers, so the grade means something.</p>
      <button class="begin-cta" id="start-btn">Begin the quiz</button>
      <p class="landing-footer"><span>An 11-question essay in disguise · ≈ 5 minutes</span><hr></p>
    </article>
  </section>

  <section id="view-quiz" class="view view-quiz" hidden>
    <article class="card">
      <header class="quiz-header">
        <div class="row">
          <span class="left" id="progress-num">Question 01 · of 11</span>
          <span class="right">No skips · No back-fills</span>
        </div>
        <div class="progress-marks" id="progress-marks" aria-hidden="true"></div>
      </header>
      <div id="question" class="question"></div>
      <nav class="quiz-nav">
        <button class="nav-link back" id="back-btn" disabled>← Back</button>
        <button class="nav-link next" id="next-btn" disabled>Next →</button>
      </nav>
    </article>
  </section>

  <section id="view-result" class="view view-result" hidden>
    <article class="card" id="result-root"></article>
  </section>

</main>
<script type="module" src="/ai-quiz/js/main.js"></script>
</body>
</html>
